name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - "design/**"
      - "polish/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable-src

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stable-src/package-lock.json

      - name: Install stable dependencies
        working-directory: stable-src
        run: npm ci --no-audit --no-fund

      - name: Build stable site
        working-directory: stable-src
        run: npx vite build --base=/Fcc-gpt-line-ink/ --outDir="${{ github.workspace }}/dist/client"

      - name: Check out branch preview
        if: github.ref_name != 'main'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: preview-src

      - name: Install preview dependencies
        if: github.ref_name != 'main'
        working-directory: preview-src
        run: npm ci --no-audit --no-fund

      - name: Build branch preview
        if: github.ref_name != 'main'
        working-directory: preview-src
        run: npx vite build --base="/Fcc-gpt-line-ink/previews/${{ github.ref_name }}/" --outDir="${{ github.workspace }}/dist/client/previews/${{ github.ref_name }}"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
