name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable site
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install stable dependencies
        run: npm ci --no-audit --no-fund
      - name: Build stable site
        run: npx vite build --base=/Fcc-gpt-line-ink/ --outDir=dist/client

      - name: Check out PR preview
        uses: actions/checkout@v4
        with:
          ref: design/hig-bilingual-pass
          path: preview-src
      - name: Install preview dependencies
        working-directory: preview-src
        run: npm ci --no-audit --no-fund
      - name: Build PR preview
        working-directory: preview-src
        run: npx vite build --base=/Fcc-gpt-line-ink/preview/ --outDir="${{ github.workspace }}/dist/client/preview"

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
